name: Demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: PHP and browser engines match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate expected results from src/Engine.php
        run: php demo/test/gen-fixtures.php
      - name: Compare with demo/src/engine.js
        run: node --max-old-space-size=2048 demo/test/parity.mjs
      - name: Build the static site
        run: php demo/build.php _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: parity
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
